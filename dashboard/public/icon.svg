<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0d0d0d"/>

  <!-- Outer target ring -->
  <circle cx="32" cy="32" r="20" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3" opacity="0.35"/>

  <!-- Inner target ring -->
  <circle cx="32" cy="32" r="12" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>

  <!-- Cross-hair lines -->
  <line x1="32" y1="8" x2="32" y2="20" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="44" x2="32" y2="56" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="8" y1="32" x2="20" y2="32" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="44" y1="32" x2="56" y2="32" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Center core dot -->
  <circle cx="32" cy="32" r="4.5" fill="#f97316"/>
  <circle cx="32" cy="32" r="2" fill="#fff"/>

  <!-- Orion star dots — top-left constellation -->
  <circle cx="18" cy="16" r="1.5" fill="#f97316" opacity="0.9"/>
  <circle cx="22" cy="12" r="1" fill="#f97316" opacity="0.6"/>
  <circle cx="14" cy="20" r="1" fill="#f97316" opacity="0.5"/>

  <!-- Connector lines for constellation -->
  <line x1="18" y1="16" x2="22" y2="12" stroke="#f97316" stroke-width="0.7" opacity="0.4"/>
  <line x1="14" y1="20" x2="18" y2="16" stroke="#f97316" stroke-width="0.7" opacity="0.4"/>
</svg>
